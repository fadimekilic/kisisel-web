<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Web Sitesi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
        }
        h1 { color: #2c3e50; font-size: 22px; }
        p { color: #555; line-height: 1.5; }
        .badge {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Web Barındırma ve DNS Ödevi</h1>
        <p>Bu site, ücretsiz alan adı ve hosting entegrasyonu ile yayına alınmış kişisel web sitesidir.</p>
        <div>
            <span class="badge">A Kaydı</span>
            <span class="badge">CNAME</span>
            <span class="badge">MX</span>
            <span class="badge">NS</span>
        </div>
    </div>
</body>
</html>
